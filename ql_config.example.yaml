# GameMale 自动签到配置文件
# 支持多账户，每个账户可以单独配置

accounts:
  # 账户1 - 启用通知
  - cookie: "TVj0_2132_nofavfid=1; TVj0_2132_smile=1D1; ..."
    username: "用户1"
    password: "密码1"
    auto_exchange: true  # 是否自动兑换血液为旅程
    auto_accept_tasks: true     # 是否自动接取新任务
    auto_complete_tasks: true   # 是否自动领取已完成任务奖励
    task_exclude_ids: []        # 按任务 ID 排除，例如 ["25"]
    task_exclude_names: []      # 按完整任务名排除，例如 ["每周发帖任务"]
    task_exclude_keywords: []   # 按关键词排除，例如 ["发帖"]
    notify_enabled: true         # 发送通知

  # 账户2 - 禁用通知（任务正常执行，但不会在通知中显示结果）
  - cookie: ""
    username: "用户2"
    password: "密码2"
    auto_exchange: true
    auto_accept_tasks: true
    auto_complete_tasks: true
    task_exclude_ids: []
    task_exclude_names: []
    task_exclude_keywords: []
    notify_enabled: false        # 不发送通知

  # 更多账户...
