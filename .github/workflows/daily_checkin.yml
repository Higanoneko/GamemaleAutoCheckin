name: Gamemale Daily Tasks

on:
  schedule:
    # UTC 16:00 = 北京时间 00:00
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: '启用调试输出'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 防止同时运行多个实例
concurrency:
  group: gamemale-daily
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PYTHONUNBUFFERED: '1'

jobs:
  daily-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ocr.txt

      - name: Run daily tasks
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
          GAMEMALE_ACCOUNTS: ${{ secrets.GAMEMALE_ACCOUNTS }}
          GAMEMALE_COOKIE: ${{ secrets.GAMEMALE_COOKIE }}
          GAMEMALE_CF_SOLVER: ${{ secrets.GAMEMALE_CF_SOLVER }}
          GAMEMALE_CF_API_KEY: ${{ secrets.GAMEMALE_CF_API_KEY }}
        run: python gamemale_daily.py

      - name: Report failure
        if: failure()
        run: echo "::error::Gamemale daily tasks failed. Check logs for details."
